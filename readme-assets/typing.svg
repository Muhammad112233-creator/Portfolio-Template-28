<svg xmlns="http://www.w3.org/2000/svg" width="860" height="44" viewBox="0 0 860 44">
  <rect width="860" height="44" rx="8" fill="#020408"/>
  <defs>
    <clipPath id="reveal"><rect x="0" y="0" width="0" height="44">
      <animate attributeName="width" from="0" to="560" dur="4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect></clipPath>
  </defs>
  <g font-family="'Consolas','Courier New',monospace" font-size="17">
    <text x="18" y="28" fill="#00ff88">$</text>
    <g clip-path="url(#reveal)">
      <text x="38" y="28"><tspan fill="#00f5ff">git clone</tspan><tspan fill="#d7f6ff"> curiosity.git</tspan><tspan fill="#ffee00"> --depth=1</tspan><tspan fill="#ff006e"> &&amp; ship_it</tspan></text>
    </g>
    <rect x="38" y="14" width="10" height="18" fill="#00f5ff">
      <animate attributeName="x" from="38" to="560" dur="4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.83;0.84;0.92;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
